function wrapCanvas(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){const words=String(text||'').split(' ');let line='',lines=[];for(let word of words){let trial=line?line+' '+word:word;if(ctx.measureText(trial).width>maxWidth&&line){lines.push(line);line=word}else line=trial}if(line)lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((s,i)=>ctx.fillText(s,x,y+i*lineHeight));return y+lines.length*lineHeight}

function generateMatches(event){let output=[];for(let cat of event.categories){const members=people(event.id).filter(p=>p.categoryId===cat.id&&p.status==='Confirmed').slice(0,8);if(members.length<2)continue;const format=event.format;const isTeam=cat.unit==='team';const label=p=>isTeam?(p.team||p.name):cat.unit==='pair'?(p.name+' / '+(p.partner||'Partner TBD')):p.name;
 if(/knockout/i.test(format)&&!format.toLowerCase().includes('group')){for(let j=0;j+1<members.length;j+=2){output.push({id:uid('MT'),eventId:event.id,categoryId:cat.id,round:'Quarterfinal',playerA:label(members[j]),playerB:label(members[j+1]),scoreA:null,scoreB:null,status:'Scheduled',court:'Court '+(output.length%4+1),time:event.time||'09:00',official:'Unassigned'})}}

 }return output}
function resultWinner(m){if(m.status!=='Completed'||m.scoreA==null||m.scoreB==null)return null;return Number(m.scoreA)===Number(m.scoreB)?'Tie':Number(m.scoreA)>Number(m.scoreB)?m.playerA:m.playerB}
function standingsFor(id){const games=matches(id).filter(m=>m.status==='Completed'&&m.scoreA!==null&&m.scoreB!==null);const players={};for(const m of games){for(let key of ['playerA','playerB']){let name=m[key];players[name]??={name,played:0,wins:0,losses:0,draws:0,points:0};players[name].played++}const winner=resultWinner(m);if(winner==='Tie'){players[m.playerA].draws++;players[m.playerB].draws++;players[m.playerA].points++;players[m.playerB].points++}else if(winner){players[winner].wins++;players[winner].points+=3;players[winner===m.playerA?m.playerB:m.playerA].losses++}}return Object.values(players).sort((a,b)=>b.points-a.points||b.wins-a.wins||a.name.localeCompare(b.name))}

function openModal(kind,data={}){ui.modal=kind;ui.modalData=data;render();setTimeout(()=>document.querySelector('.modal input:not([type="hidden"]),.modal select,.modal textarea,.modal .close')?.focus(),20)}
function closeModal(){ui.modal='';ui.modalData={};render()}
function csvDownload(filename,rows){if(!rows.length){toast('Nothing to export yet',true);return}const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[headers,...rows.map(r=>headers.map(k=>r[k]??''))].map(line=>line.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');downloadBlob(filename,new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}))}
function downloadBlob(filename,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded '+filename)}
function duplicateEvent(id){let orig=selected(id),copy=structuredClone(orig);copy.id=uid('EVT');copy.title=orig.title+' — Next edition';copy.start='';copy.end='';copy.deadline='';copy.status='Draft';copy.externalUrl='';copy.createdAt=today();copy.categories=copy.categories.map(c=>({...c,id:uid('CAT')}));state.events.unshift(copy);ui.wizardId=copy.id;ui.eventId=copy.id;ui.wizardStep=0;activity('Created next-edition draft from '+orig.title);persist();nav('wizard');toast('New draft created. Dates, registration and source information need reconfirmation.')}

function safeMoneyFromParticipant(p,e){let cat=e.categories.find(c=>c.id===p.categoryId);return Number(cat?.fee??e.fee??0)}
function syncParticipantIncome(p,previousPaid){if(p.paymentStatus==='Paid'&&!previousPaid){const e=selected(p.eventId);state.transactions.push({id:uid('TX'),eventId:p.eventId,participantId:p.id,kind:'Income',amount:safeMoneyFromParticipant(p,e),status:'Reconciled',description:'Demo registration · '+p.name,date:today()})}else if(previousPaid&&p.paymentStatus==='Refunded'){const paid=state.transactions.filter(x=>x.participantId===p.id&&x.kind==='Income'&&x.status==='Reconciled');if(paid.length&&!state.transactions.some(x=>x.participantId===p.id&&x.kind==='Refund'))state.transactions.push({id:uid('TX'),eventId:p.eventId,participantId:p.id,kind:'Refund',amount:paid[paid.length-1].amount,status:'Reconciled',description:'Demo refund · '+p.name,date:today()})}}

 if(mode==='participant'){const prior=state.participants.find(p=>p.id===d.id);const event=ev();const extras={};(event.customFieldsText||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,10).forEach((question,i)=>{extras[question]=data['extra_'+i]||''});if(!event.categories.length){toast('Create an event category first',true);return}if(prior){let was=prior.paymentStatus==='Paid';Object.assign(prior,{name:data.name.trim(),email:data.email,categoryId:data.categoryId,status:data.status,paymentStatus:data.paymentStatus,verification:data.verification,partner:data.partner,source:data.source,extras,checkedIn:!!data.checkedIn});syncParticipantIncome(prior,was)}else{let p={id:uid('REG'),eventId:event.id,name:data.name.trim(),email:data.email,phone:'',categoryId:data.categoryId,partner:data.partner,extras,team:'',date:today(),status:data.status,paymentStatus:data.paymentStatus,verification:data.verification,source:data.source,checkedIn:!!data.checkedIn};state.participants.unshift(p);syncParticipantIncome(p,false)}activity('Registration record updated: '+data.name);changed=true}
 if(mode==='campaign'){let c=state.campaigns.find(x=>x.id===d.id);const payload={name:data.name.trim(),eventId:data.eventId,objective:data.objective,channels:data.channels,audience:data.audience,budget:Math.max(0,Number(data.budget)||0),spend:Math.max(0,Number(data.spend)||0),start:data.start,end:data.end,status:data.status,simulated:true};if(c)Object.assign(c,payload);else state.campaigns.push({id:uid('CAM'),...payload,clicks:0,registrations:0});activity('Campaign saved: '+data.name);changed=true}
 if(mode==='transaction'){let t=state.transactions.find(x=>x.id===d.id),payload={description:data.description.trim(),eventId:data.eventId,kind:data.kind,status:data.status,amount:Math.max(0,Number(data.amount)||0),date:data.date};if(t)Object.assign(t,payload);else state.transactions.push({id:uid('TX'),...payload});activity('Finance ledger updated: '+data.description);changed=true}
 if(mode==='budget'){ev().budget=Math.max(0,Number(data.budget)||0);activity('Event budget updated');changed=true}
 if(mode==='announcement'){state.announcements.push({id:uid('ANN'),eventId:ev().id,title:data.title.trim(),message:data.message, audience:data.audience,time:new Date().toLocaleString('en-IN'),sent:false});activity('Simulated announcement: '+data.title);changed=true}
 if(mode==='incident'){state.incidents.unshift({id:uid('INC'),eventId:ev().id,title:data.title.trim(),details:data.details,priority:data.priority,status:'Open'});activity('Incident logged: '+data.title);changed=true}
 if(mode==='volunteer'){state.volunteers.push({id:uid('VOL'),name:data.name.trim(),role:data.role,shift:data.shift});changed=true}
 if(mode==='score'){let m=state.matches.find(x=>x.id===d.id);if(m){m.scoreA=Math.max(0,Number(data.scoreA)||0);m.scoreB=Math.max(0,Number(data.scoreB)||0);m.status=data.status;if(m.status==='Completed'&&m.scoreA===m.scoreB)toast('Tie recorded. Confirm tie-break rules with your organizer.',false);activity('Match score updated: '+m.playerA+' vs '+m.playerB);changed=true}}
 if(mode==='court'){let m=state.matches.find(x=>x.id===d.id);if(m){m.court=data.court;m.time=data.time;m.official=data.official;activity('Court assignment updated');changed=true}}
 if(mode==='sponsor'){let s=state.sponsors.find(x=>x.id===d.id);let payload={name:data.name.trim(),contact:data.contact,eventId:data.eventId,tier:data.tier,value:Math.max(0,Number(data.value)||0),status:data.status,notes:data.notes};if(s)Object.assign(s,payload);else state.sponsors.push({id:uid('SP'),...payload});activity('Sponsor prospect updated: '+data.name);changed=true}

function updateWizardField(target){const e=selected(ui.wizardId);if(!e)return;if(target.dataset.catField){const cat=e.categories.find(c=>c.id===target.dataset.catId);if(cat){cat[target.dataset.catField]=target.type==='number'?Math.max(0,Number(target.value)||0):target.value;persist()}return}if(!target.name||target.closest('#wizard-form')===null)return;e[target.name]=target.type==='number'?Math.max(0,Number(target.value)||0):target.type==='checkbox'?target.checked:target.value;persist()}

function action(name,el){const id=el.dataset.id,value=el.dataset.value;switch(name){
 case 'enter-demo':ui.auth=true;try{sessionStorage.setItem('mercury-demo-auth','1')}catch{}render();return;
 case 'toggle-menu':ui.sidebarOpen=!ui.sidebarOpen;render();return;
 case 'close-menu':ui.sidebarOpen=false;render();return;
 case 'close-modal':closeModal();return;
 case 'show-help':openModal('help');return;
 case 'open-org-profile':nav('settings');return;
 case 'new-event':openModal('choose-event-flow');return;
 case 'start-event-external':ui.modal='';newEvent('External website');return;
 case 'start-event-mercury':ui.modal='';newEvent('Mercury (demo)');return;
 case 'go-events':nav('events');return;
 case 'go-registrations':nav('registrations');return;
 case 'go-marketing':nav('marketing');return;
 case 'go-creative':ui.creative.eventId=ev().id;nav('creative');return;
 case 'go-tournament':nav('tournament');return;
 case 'go-eventday':nav('eventday');return;
 case 'go-services':nav('services');return;
 case 'go-finance':nav('finance');return;
 case 'go-analytics':nav('analytics');return;
 case 'view-requests':nav('requests');return;
 case 'open-active-event':ui.page='event';location.hash='/event';render();return;
 case 'view-event':if(id)ui.eventId=id;ui.page='event';location.hash='/event';render();return;
 case 'edit-event':ui.wizardId=id||ev().id;ui.eventId=ui.wizardId;ui.wizardStep=0;nav('wizard');return;
 case 'duplicate-event':duplicateEvent(id||ev().id);return;

 default:console.warn('Unrecognized action',name);toast('This action is not configured',true);

function maintainInputFocus(target,update){const id=target.id,pos=typeof target.selectionStart==='number'?target.selectionStart:null;update();const fresh=id?document.getElementById(id):null;if(fresh){fresh.focus();try{if(pos!==null)fresh.setSelectionRange(pos,pos)}catch{}}}
document.addEventListener('click',event=>{const element=event.target.closest('[data-action],[data-nav]');if(!element)return;event.preventDefault();if(element.dataset.nav){nav(element.dataset.nav);return}try{action(element.dataset.action,element)}catch(err){console.error('Action failed',err);toast('An action could not be completed: '+err.message,true)} });
document.addEventListener('submit',event=>{let form=event.target;if(!form.matches('[data-form]'))return;event.preventDefault();if(form.dataset.form==='wizard'){persist();toast('Draft saved in your browser');return}if(form.dataset.form==='service-request'){saveServiceDraft();return}if(form.dataset.form==='organization'){saveModalForm(form);return}try{saveModalForm(form)}catch(err){console.error(err);toast('Form could not be saved: '+err.message,true)}});
document.addEventListener('input',event=>{const t=event.target;if(t.closest('#wizard-form')){updateWizardField(t);return}if(t.closest('#service-request-form')){saveServiceDraft();return}if(t.id==='events-search'||t.id==='registration-search'){maintainInputFocus(t,()=>{ui.search=t.value;render()});return}if(t.id==='services-search'){maintainInputFocus(t,()=>{ui.serviceQuery=t.value;render()});return}if(t.id==='fld-creative-headline'||t.id==='fld-creative-subline'||t.id==='fld-creative-sponsor'){ui.creative[t.id==='fld-creative-headline'?'headline':t.id==='fld-creative-subline'?'subline':'sponsor']=t.value;const display=document.getElementById(t.id==='fld-creative-headline'?'poster-headline':'poster-subline');if(t.id!=='fld-creative-sponsor'&&display)display.textContent=t.value||selected(ui.creative.eventId).title;if(t.id==='fld-creative-sponsor')document.querySelector('.poster-bottom span:last-child').textContent=t.value||'REGISTER / DISCOVER ↗';drawPoster();return}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='event-selector'||t.id==='header-event-selector'){ui.eventId=t.value;if(ui.page==='creative')ui.creative.eventId=t.value;render();return}if(t.id==='event-sport-filter'){ui.sportFilter=t.value;render();return}if(t.id==='select-all-participants'){document.querySelectorAll('.participant-check').forEach(x=>x.checked=t.checked);return}if(t.closest('#wizard-form')){updateWizardField(t);if(t.name==='sport'){toast('Sport changed; review the categories and rules.');render()}return}if(t.closest('#service-request-form')){saveServiceDraft();return}if(t.id==='fld-creative-event'){ui.creative.eventId=t.value;ui.creative.headline='';ui.creative.subline='';render();return}if(t.id==='fld-creative-type'){ui.creative.type=t.value;render();return}if(t.id==='creative-logo-upload'){const f=t.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1024*1024){toast('Use an approved PNG, JPEG or WebP image under 1 MB',true);return}const reader=new FileReader();reader.onload=()=>{ui.creative.logo=String(reader.result||'');render();toast('Logo added locally to the creative')};reader.onerror=()=>toast('Could not read this image',true);reader.readAsDataURL(f);return}if(t.id==='notify-pref'){state.org.notify=t.checked;persist();toast('Local preference saved');return}});
