name: Mercury UX browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: cp artifacts/design-review/approved-in-play.html public/__approved-reference.html
      - run: cp artifacts/design-review/approved-organizer-v2.html public/__organizer-reference.html
      - run: pnpm run build
      - name: Start isolated Mercury and Chrome
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec next start -p 3002 >/tmp/mercury-next.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --silent --fail http://localhost:3002/ >/dev/null; then break; fi
            if [ "$i" -eq 50 ]; then cat /tmp/mercury-next.log; exit 1; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins='*' --remote-debugging-port=9223 --user-data-dir=/tmp/mercury-ux-browser about:blank >/tmp/mercury-chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9223/json >/dev/null; then break; fi
            if [ "$i" -eq 30 ]; then cat /tmp/mercury-chrome.log; exit 1; fi
            sleep 1
          done
      - name: Real-browser Home and organizer paths
        run: |
          mkdir -p /tmp/mercury-ux-captures
          node artifacts/design-review/capture.mjs http://localhost:3002/ 1440 900 /tmp/mercury-ux-captures/home-desktop.json fixture-home ux-home
          node artifacts/design-review/capture.mjs http://localhost:3002/ 390 844 /tmp/mercury-ux-captures/home-phone.json fixture-home ux-home
          node artifacts/design-review/capture.mjs http://localhost:3002/ 320 740 /tmp/mercury-ux-captures/home-small.json fixture-home ux-home
          node artifacts/design-review/capture.mjs http://localhost:3002/ 768 900 /tmp/mercury-ux-captures/home-tablet.json fixture-home ux-home
          node artifacts/design-review/capture.mjs http://localhost:3002/ 390 844 /tmp/mercury-ux-captures/home-phone.png fixture-home
          node artifacts/design-review/capture.mjs http://localhost:3002/ 1440 900 /tmp/mercury-ux-captures/home-desktop.png fixture-home
          node artifacts/design-review/capture.mjs http://localhost:3002/ 1440 900 /tmp/mercury-ux-captures/explore-warm-navigation.json fixture-slow-session explore-fast
          node artifacts/design-review/capture.mjs http://localhost:3002/how-it-works 390 844 /tmp/mercury-ux-captures/explore-cold-navigation.json fixture-slow-session explore-fast
          node artifacts/design-review/capture.mjs http://localhost:3002/for-organizers 1440 900 /tmp/mercury-ux-captures/organizer-landing-desktop.json fixture-home public-organizer
          node artifacts/design-review/capture.mjs http://localhost:3002/for-organizers 390 844 /tmp/mercury-ux-captures/organizer-landing-phone.json fixture-home public-organizer
          node artifacts/design-review/capture.mjs http://localhost:3002/how-it-works 390 844 /tmp/mercury-ux-captures/how-it-works-phone.json fixture-home public-how
          node artifacts/design-review/capture.mjs http://localhost:3002/list-event 390 844 /tmp/mercury-ux-captures/list-event-phone.json fixture-event-submission public-submission
          node artifacts/design-review/capture.mjs http://localhost:3002/ 1440 900 /tmp/mercury-ux-captures/kinetic-home.json fixture-home kinetic-home
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 1440 900 /tmp/mercury-ux-captures/kinetic-explore-desktop.json fixture-explore kinetic-explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 390 844 /tmp/mercury-ux-captures/kinetic-explore-phone.json fixture-explore kinetic-explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 320 740 /tmp/mercury-ux-captures/kinetic-explore-small.json fixture-explore kinetic-explore
          node artifacts/design-review/capture.mjs http://localhost:3002/listing/mumbai-flex-nov-2026 1440 900 /tmp/mercury-ux-captures/kinetic-listing-desktop.json fixture-explore kinetic-detail
          node artifacts/design-review/capture.mjs http://localhost:3002/listing/mumbai-flex-nov-2026 390 844 /tmp/mercury-ux-captures/kinetic-listing-phone.json fixture-explore kinetic-detail
          node artifacts/design-review/capture.mjs http://localhost:3002/listing/mumbai-flex-nov-2026 1440 900 /tmp/mercury-ux-captures/kinetic-listing-desktop.png fixture-explore
          node artifacts/design-review/capture.mjs http://localhost:3002/for-organizers 1440 900 /tmp/mercury-ux-captures/kinetic-organizers-desktop.png fixture-home
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 1440 900 /tmp/mercury-ux-captures/explore-desktop.json fixture-explore explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 390 844 /tmp/mercury-ux-captures/explore-phone.json fixture-native-explore explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 320 740 /tmp/mercury-ux-captures/explore-small-phone.json fixture-explore explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 768 900 /tmp/mercury-ux-captures/explore-tablet.json fixture-explore explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 1440 900 /tmp/mercury-ux-captures/explore-desktop.png fixture-explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 390 844 /tmp/mercury-ux-captures/explore-phone.png fixture-explore
          node artifacts/design-review/capture.mjs http://localhost:3002/explore 390 844 /tmp/mercury-ux-captures/explore-handoff.json fixture-explore handoff
          node artifacts/design-review/capture.mjs http://localhost:3002/ 1440 900 /tmp/mercury-ux-captures/organizer-desktop.json fixture-organizer ux-organizer
          node artifacts/design-review/capture.mjs http://localhost:3002/ 390 844 /tmp/mercury-ux-captures/organizer-phone.json fixture-organizer ux-organizer
          node artifacts/design-review/capture.mjs http://localhost:3002/ 390 844 /tmp/mercury-ux-captures/roster-phone.json fixture-roster ux-roster
      - name: Organizer workspace behavior
        run: |
          for size in "1440 900 laptop" "390 844 mobile" "320 740 small"; do
            set -- $size
            node artifacts/design-review/capture.mjs http://localhost:3002/host "$1" "$2" "/tmp/mercury-ux-captures/organizer-workspace-$3.json" fixture-organizer-workspace ux-workspace
          done
      - name: Organizer workspace screenshots
        if: always()
        run: |
          for size in "1440 900 laptop" "390 844 mobile"; do
            set -- $size
            node artifacts/design-review/capture.mjs http://localhost:3002/__organizer-reference.html "$1" "$2" "/tmp/mercury-ux-captures/organizer-reference-$3.png" organizer-reference full
            for route in home events new settings services requests event/review-state event/review-state?tab=promote event/review-state?tab=creative event/review-state?tab=competition event/review-state?tab=finance event/review-state?tab=insights event/review-state?tab=sponsors; do
              path="$route"
              if [ "$route" = home ]; then path=""; fi
              name="$(echo "$route" | tr '/?=' '---')"
              node artifacts/design-review/capture.mjs "http://localhost:3002/host/$path" "$1" "$2" "/tmp/mercury-ux-captures/organizer-$name-$3.png" fixture-organizer-workspace full
            done
            node artifacts/design-review/capture.mjs "http://localhost:3002/roster/review-state" "$1" "$2" "/tmp/mercury-ux-captures/organizer-participants-$3.png" fixture-organizer-workspace full
          done
      - name: Approved design screenshots
        if: always()
        run: |
          for size in "1440 900 laptop" "390 844 mobile"; do
            set -- $size
            node artifacts/design-review/capture.mjs http://localhost:3002/__approved-reference.html "$1" "$2" "/tmp/mercury-ux-captures/reference-$3.png" live full
            for page in home explore for-organizers how-it-works list-event about support privacy terms account my-games community-rules; do
              route="$page"
              if [ "$page" = home ]; then route=""; fi
              node artifacts/design-review/capture.mjs "http://localhost:3002/$route" "$1" "$2" "/tmp/mercury-ux-captures/$page-$3.png" fixture-home full
            done
            node artifacts/design-review/capture.mjs http://localhost:3002/listing/mumbai-flex-nov-2026 "$1" "$2" "/tmp/mercury-ux-captures/event-external-$3.png" fixture-explore full
            node artifacts/design-review/capture.mjs http://localhost:3002/event/review-state "$1" "$2" "/tmp/mercury-ux-captures/event-mercury-$3.png" fixture-home full
            node artifacts/design-review/capture.mjs http://localhost:3002/explore "$1" "$2" "/tmp/mercury-ux-captures/filters-$3.png" fixture-open-filters full
          done
      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercury-ux-browser-reports
          path: /tmp/mercury-ux-captures/
          if-no-files-found: ignore
